<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Update Agent</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
    }

    .topbar {
      background: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }

    .wrap {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    textarea {
      height: 220px;
      resize: vertical;
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn2 {
      background: #111827;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .logout {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div><b>Agent Studio</b></div>
    <div>
      <span id="user"></span>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card">
        <h2>Update Agent</h2>
        <div class="muted">Edit details and click Update. You can test after saving.</div>

        <label>Agent Name</label>
        <input id="agentName" placeholder="e.g., Replacement SOP Agent" />

        <label>Category</label>
        <select id="categorySelect">
          <option value="return_labels">Return Labels</option>
          <option value="order_status">Order Status</option>
          <option value="replacements">Replacements</option>
          <option value="cancellations">Cancellations</option>
          <option value="refund_drafts">Refund Drafts</option>
          <option value="escalation">Escalation</option>
          <option value="other">Other</option>
        </select>

        <label>Agent Instructions</label>
        <textarea id="instructions" placeholder="Write system instructions for the agent..."></textarea>

        <div class="row" style="flex-wrap:wrap;">
          <button class="btn" id="updateBtn">Update Agent</button>
          <button class="btn2" id="testBtn">Test</button>
          <button class="btn2" id="dashBtn">Dashboard</button>
          <button class="btn2" id="builderBtn">Builder</button>
        </div>

        <div id="msg" class="muted"></div>
      </div>

      <div class="card">
        <h3>Tip</h3>
        <div class="muted">Your update will create a new version. Use Category to label the instruction section.</div>
        <pre style="white-space:pre-wrap; background:#f9fafb; padding:12px; border-radius:12px; border:1px solid #e5e7eb;">
Example:
Category: cancellations
Instructions:
- Ask for order id
- Check order status
- Cancel only if not shipped
        </pre>
      </div>
    </div>
  </div>

  <script>
    const agentId = window.location.pathname.split("/")[2];

    async function loadMe() {
      const res = await fetch("/api/me");
      const data = await res.json();
      if (!data.user) { window.location.href = "/login"; return; }
      document.getElementById("user").textContent = `${data.user.username} (${data.user.role})`;
    }

    async function loadAgent() {
      const res = await fetch(`/api/agents/${agentId}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        document.getElementById("msg").textContent = data.message || "Agent not found";
        return;
      }

      document.getElementById("agentName").value = data.agent?.name || "";
      document.getElementById("instructions").value = data.agent?.instructions || "";
      document.getElementById("categorySelect").value = data.agent?.category || "replacements";
    }

    document.getElementById("logoutBtn").onclick = async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login";
    };

    document.getElementById("testBtn").onclick = () => {
      window.location.href = `/agent/${agentId}/test`;
    };

    document.getElementById("dashBtn").onclick = () => {
      window.location.href = `/agent/${agentId}/dashboard`;
    };

    document.getElementById("builderBtn").onclick = () => {
      window.location.href = `/agent/${agentId}/builder`;
    };

    document.getElementById("updateBtn").onclick = async () => {
      const msg = document.getElementById("msg");
      msg.textContent = "Updating agent...";

      const payload = {
        name: document.getElementById("agentName").value.trim(),
        instructions: document.getElementById("instructions").value.trim(),
        category: document.getElementById("categorySelect").value
      };

      const res = await fetch(`/agent/${agentId}/update`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        credentials:"include",
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg.textContent = data.message || "Failed to update";
        return;
      }

      // backend returns { ok: true, agent: { id: ... } } where id might change (new version)
      const newId = data.agent?.id || agentId;
      msg.textContent = "Updated ✅";

      // Move user to the updated agent version test page
      window.location.href = `/agent/${newId}/test`;
    };

    loadMe();
    loadAgent();
  </script>
</body>

</html>
